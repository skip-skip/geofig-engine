[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geofig-engine"
version = "0.5.1"
description = "A declarative visualization system"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "matplotlib",
    "numpy",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "build",
]
geo = [
    "pyproj>=3.4",
    "pyshp>=2.0",
]
network = [
    "requests",
    "pillow",
    "xyzservices",
]
full = [
    "pytest",
    "pytest-cov",
    "build",
    "pyproj>=3.4",
    "pyshp>=2.0",
    "requests",
    "pillow",
    "xyzservices",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["geofig_engine*"]

[tool.setuptools.package-data]
geofig_engine = [
    "py.typed",
    "data/geom_presets/*.json",
]
